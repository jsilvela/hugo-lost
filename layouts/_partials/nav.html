		{{if or .PrevInSection .NextInSection}}
		<table>
			{{with .NextInSection}}
				<tr>
					<th><a href="{{.RelPermalink}}">
						Next
						</a>
					</th>
					<td>
						{{.LinkTitle | markdownify}}
					</td>
				</tr>
			{{end}}
			{{with .PrevInSection}}
				<tr>
					<th>
						<a href="{{.RelPermalink}}">
							Previous
						</a>
					</th>
					<td>
						{{.LinkTitle | markdownify}}
					</td>
				</tr>
			{{end}}
		</table>
		{{end}}
